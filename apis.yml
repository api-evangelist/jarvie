aid: jarvie
name: Jarvie
description: 'Jarvie is a consumer AI assistant from All Day Technologies, Inc. that
  lives inside iMessage and SMS group chats. Marketed as "your group chat sidekick,"
  it helps people who text together plan events, learn things, and have fun, and can
  draft emails and create calendar events on a user''s behalf. It offers memory features
  to personalize responses across conversations. Jarvie is a mobile-messaging consumer
  product surfaced as a portfolio company of Lightspeed Venture Partners; as of this
  profile it does not publish a public API, developer portal, SDKs, or documentation
  surface.'
